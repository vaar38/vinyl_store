<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1030" viewBox="0 0 2400 1030" role="img" aria-labelledby="title desc"><title id="title">BPMN: оформление и доставка заказа</title><desc id="desc">Три дорожки: покупатель, система и сотрудник. Если товара недостаточно, покупатель меняет корзину. При наличии система сохраняет заказ, сотрудник собирает и отправляет его, затем отмечает доставку.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#522944"/></marker></defs><rect width="2400" height="1030" fill="#fcf7ed"/><g font-family="Arial, sans-serif" fill="#332337"><text x="1200" y="46" font-size="30" font-weight="700" text-anchor="middle">Оформление и доставка заказа</text><text x="1200" y="78" font-size="19" text-anchor="middle" fill="#756b72">BPMN 2.0 · магазин виниловых пластинок</text><rect x="25" y="110" width="2350" height="820" fill="#fffdf8" stroke="#522944" stroke-width="2"/><rect x="25" y="110" width="75" height="820" fill="#eee5de" stroke="#522944" stroke-width="2"/><text transform="translate(72 520) rotate(-90)" text-anchor="middle" font-size="25" font-weight="700">Магазин виниловых пластинок</text><rect x="100" y="110" width="2275" height="240" fill="#fcf7ed" stroke="#b9a8b3" stroke-width="1.4"/><path d="M145 110 V350" stroke="#b9a8b3" stroke-width="1.4"/><text transform="translate(130 230) rotate(-90)" text-anchor="middle" font-size="23" font-weight="700">Покупатель</text><rect x="100" y="350" width="2275" height="300" fill="#f2efed" stroke="#b9a8b3" stroke-width="1.4"/><path d="M145 350 V650" stroke="#b9a8b3" stroke-width="1.4"/><text transform="translate(130 500) rotate(-90)" text-anchor="middle" font-size="23" font-weight="700">Система</text><rect x="100" y="650" width="2275" height="280" fill="#fcf7ed" stroke="#b9a8b3" stroke-width="1.4"/><path d="M145 650 V930" stroke="#b9a8b3" stroke-width="1.4"/><text transform="translate(130 790) rotate(-90)" text-anchor="middle" font-size="23" font-weight="700">Сотрудник</text><circle cx="190" cy="220" r="20" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="190" y="266" font-size="17" text-anchor="middle" fill="#332337"><tspan x="190" dy="0">Начало</tspan></text><rect x="245" y="175" width="185" height="90" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="337.5" y="214" font-size="22" text-anchor="middle" fill="#332337"><tspan x="337.5" dy="0">Выбрать</tspan><tspan x="337.5" dy="29">пластинки</tspan></text><rect x="480" y="175" width="185" height="90" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="572.5" y="214" font-size="22" text-anchor="middle" fill="#332337"><tspan x="572.5" dy="0">Проверить</tspan><tspan x="572.5" dy="29">корзину</tspan></text><rect x="715" y="175" width="205" height="90" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="817.5" y="200" font-size="22" text-anchor="middle" fill="#332337"><tspan x="817.5" dy="0">Указать адрес</tspan><tspan x="817.5" dy="29">и подтвердить</tspan><tspan x="817.5" dy="29">заказ</tspan></text><path d="M210 220 H245" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M430 220 H480" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M665 220 H715" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="695" y="385" width="665" height="150" rx="10" fill="none" stroke="#8c7a87" stroke-width="1.3" stroke-dasharray="8 6"/><text x="1027" y="378" font-size="17" text-anchor="middle" fill="#756b72"><tspan x="1027" dy="0">Одна транзакция базы данных</tspan></text><rect x="715" y="415" width="205" height="90" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="817.5" y="440" font-size="22" text-anchor="middle" fill="#332337"><tspan x="817.5" dy="0">Заблокировать</tspan><tspan x="817.5" dy="29">пластинки и</tspan><tspan x="817.5" dy="29">проверить остатки</tspan></text><path d="M817 265 V415" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1010 420 L1050 460 L1010 500 L970 460 Z" fill="#fffdf8" stroke="#522944" stroke-width="2"/><path d="M998 448 L1022 472 M1022 448 L998 472" stroke="#522944" stroke-width="2"/><text x="1010" y="410" font-size="20" text-anchor="middle" fill="#332337"><tspan x="1010" dy="0">Товар есть?</tspan></text><path d="M920 460 H970" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1050 460 H1120" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1083" y="447" font-size="19" text-anchor="middle" fill="#332337"><tspan x="1083" dy="0">Да</tspan></text><rect x="1120" y="415" width="220" height="90" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="1230" y="440" font-size="22" text-anchor="middle" fill="#332337"><tspan x="1230" dy="0">Сохранить заказ,</tspan><tspan x="1230" dy="29">списать товар и</tspan><tspan x="1230" dy="29">очистить корзину</tspan></text><rect x="1410" y="415" width="205" height="90" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="1512.5" y="454" font-size="22" text-anchor="middle" fill="#332337"><tspan x="1512.5" dy="0">Показать номер</tspan><tspan x="1512.5" dy="29">и сумму заказа</tspan></text><path d="M1340 460 H1410" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="920" y="558" width="180" height="65" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="1010" y="584.5" font-size="22" text-anchor="middle" fill="#332337"><tspan x="1010" dy="0">Показать ошибку</tspan><tspan x="1010" dy="29">наличия (409)</tspan></text><path d="M1010 500 V558" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1040" y="548" font-size="19" text-anchor="middle" fill="#332337"><tspan x="1040" dy="0">Нет</tspan></text><path d="M920 590 H690 V310 H572 V265" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1010" y="643" font-size="17" text-anchor="middle" fill="#756b72"><tspan x="1010" dy="0">Откат транзакции. Изменить корзину</tspan></text><rect x="1410" y="735" width="205" height="90" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="1512.5" y="774" font-size="22" text-anchor="middle" fill="#332337"><tspan x="1512.5" dy="0">Начать сборку</tspan><tspan x="1512.5" dy="29">заказа</tspan></text><rect x="1645" y="735" width="205" height="90" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="1747.5" y="774" font-size="22" text-anchor="middle" fill="#332337"><tspan x="1747.5" dy="0">Подготовить</tspan><tspan x="1747.5" dy="29">заказ к отправке</tspan></text><rect x="1880" y="735" width="205" height="90" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="1982.5" y="774" font-size="22" text-anchor="middle" fill="#332337"><tspan x="1982.5" dy="0">Передать заказ</tspan><tspan x="1982.5" dy="29">в доставку</tspan></text><rect x="2115" y="175" width="205" height="90" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="2217.5" y="214" font-size="22" text-anchor="middle" fill="#332337"><tspan x="2217.5" dy="0">Получить</tspan><tspan x="2217.5" dy="29">пластинки</tspan></text><rect x="2115" y="735" width="205" height="90" rx="12" fill="#fffdf8" stroke="#522944" stroke-width="2"/><text x="2217.5" y="774" font-size="22" text-anchor="middle" fill="#332337"><tspan x="2217.5" dy="0">Отметить заказ</tspan><tspan x="2217.5" dy="29">доставленным</tspan></text><path d="M1512 505 V735" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1615 780 H1645" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1850 780 H1880" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M2085 780 H2100 V220 H2115" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M2217 265 V735" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="2350" cy="780" r="18" fill="#fffdf8" stroke="#522944" stroke-width="4"/><path d="M2320 780 H2332" fill="none" stroke="#522944" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="2315" y="865" font-size="17" text-anchor="middle" fill="#332337"><tspan x="2315" dy="0">Заказ завершён</tspan></text><text x="1512" y="852" font-size="17" text-anchor="middle" fill="#756b72"><tspan x="1512" dy="0">Собирается</tspan></text><text x="1747" y="852" font-size="17" text-anchor="middle" fill="#756b72"><tspan x="1747" dy="0">Готов к отправке</tspan></text><text x="1982" y="852" font-size="17" text-anchor="middle" fill="#756b72"><tspan x="1982" dy="0">В доставке</tspan></text><text x="2217" y="852" font-size="17" text-anchor="middle" fill="#756b72"><tspan x="2217" dy="0">Доставлен</tspan></text><text x="1512" y="550" font-size="17" text-anchor="middle" fill="#756b72"><tspan x="1512" dy="0">Статус: оформлен</tspan></text><path d="M1150 552 V615 H1370" fill="none" stroke="#8c7a87" stroke-width="1.2"/><path d="M1240 505 V552" stroke="#8c7a87" stroke-width="1.2" stroke-dasharray="5 5"/><text x="1260" y="574" font-size="16" text-anchor="middle" fill="#756b72"><tspan x="1260" dy="0">Цена фиксируется</tspan></text><text x="1260" y="600" font-size="16" text-anchor="middle" fill="#756b72"><tspan x="1260" dy="0">в позициях заказа</tspan></text><text x="1200" y="975" font-size="18" text-anchor="middle" fill="#756b72"><tspan x="1200" dy="0">Условные обозначения: круг — событие; прямоугольник — задача; ромб с X — исключающая развилка; сплошная стрелка — поток управления</tspan></text><text x="1200" y="1005" font-size="18" text-anchor="middle" fill="#756b72"><tspan x="1200" dy="0">Доставка бесплатная. Оплата при получении. Отмена до отправки рассматривается как отдельный сценарий.</tspan></text></g></svg>