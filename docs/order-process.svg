<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1090" width="1040" height="1090" role="img" aria-labelledby="title">
<title id="title">Процесс заказа с доставкой</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#522944"/></marker></defs>
<rect width="1040" height="1090" fill="#fcf7ed"/>
<g font-family="Arial, sans-serif" fill="#332337">
<text x="520" y="39" text-anchor="middle" font-size="24" font-weight="700" fill="#522944">Процесс заказа с доставкой</text>
<rect x="16" y="63" width="1008" height="1004" rx="13" fill="#fffcf7" stroke="#522944" stroke-width="1.8"/>
<g fill="none" stroke="#522944" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head)">
<path d="M500 171 V187"/>
<path d="M500 263 V279"/>
<path d="M500 355 V379"/>
<path d="M389 420 H324"/>
<path d="M175 382 V225 H351"/>
<path d="M500 461 V483"/>
<path d="M500 559 V578"/>
<path d="M500 654 V679"/>
<path d="M649 521 H842 V682"/>
<path d="M611 720 H693"/>
<path d="M842 758 V784"/>
<path d="M500 761 V784"/>
<path d="M500 860 V879"/>
<path d="M500 955 V974"/>
</g>
<g fill="#f5e5c6" stroke="#957b8c" stroke-width="1.4">
<path d="M500 379 L611 420 L500 461 L389 420 Z"/>
<path d="M500 679 L611 720 L500 761 L389 720 Z"/>
</g>
<g font-size="14" text-anchor="middle" fill="#522944">
<text x="500" y="425" font-weight="700">Остатков хватает?</text>
<text x="500" y="716" font-weight="700">Что дальше?</text>
<text x="355" y="408">Нет</text>
<text x="522" y="476">Да</text>
<text x="260" y="214">Уточнить корзину</text>
<text x="743" y="509">Отмена до сборки</text>
<text x="650" y="708">Отмена</text>
<text x="536" y="776">Отправка</text>
</g>
<g class="step"><rect x="351" y="95" width="298" height="76" rx="30" fill="#f1e3ed" stroke="#957b8c" stroke-width="1.4"/><text x="500" y="119" text-anchor="middle" font-size="11" fill="#522944" font-weight="700">1 · Покупатель</text>
<text x="500" y="144" text-anchor="middle" font-size="15">Добавляет пластинки в корзину</text>
</g>
<g class="step"><rect x="351" y="187" width="298" height="76" rx="30" fill="#f1e3ed" stroke="#957b8c" stroke-width="1.4"/><text x="500" y="211" text-anchor="middle" font-size="11" fill="#522944" font-weight="700">2 · Покупатель</text>
<text x="500" y="236" text-anchor="middle" font-size="15">Указывает адрес и оформляет заказ</text>
</g>
<g class="step"><rect x="351" y="279" width="298" height="76" rx="30" fill="#f1e3ed" stroke="#957b8c" stroke-width="1.4"/><text x="500" y="303" text-anchor="middle" font-size="11" fill="#522944" font-weight="700">3 · Сервер</text>
<text x="500" y="322" text-anchor="middle" font-size="15">Начинает транзакцию</text>
<text x="500" y="340" text-anchor="middle" font-size="15">и блокирует строки товаров</text>
</g>
<g class="step"><rect x="26" y="382" width="298" height="76" rx="30" fill="#f5e5c6" stroke="#957b8c" stroke-width="1.4"/><text x="175" y="406" text-anchor="middle" font-size="11" fill="#522944" font-weight="700">4 · Сервер</text>
<text x="175" y="425" text-anchor="middle" font-size="15">Откатывает транзакцию</text>
<text x="175" y="443" text-anchor="middle" font-size="15">и возвращает 409 Conflict</text>
</g>
<g class="step"><rect x="351" y="483" width="298" height="76" rx="30" fill="#f1e3ed" stroke="#957b8c" stroke-width="1.4"/><text x="500" y="507" text-anchor="middle" font-size="11" fill="#522944" font-weight="700">5 · Сервер</text>
<text x="500" y="526" text-anchor="middle" font-size="15">Резервирует остатки, фиксирует</text>
<text x="500" y="544" text-anchor="middle" font-size="15">цены и сохраняет заказ</text>
</g>
<g class="step"><rect x="351" y="578" width="298" height="76" rx="30" fill="#f1e3ed" stroke="#957b8c" stroke-width="1.4"/><text x="500" y="602" text-anchor="middle" font-size="11" fill="#522944" font-weight="700">6 · Сотрудник магазина</text>
<text x="500" y="621" text-anchor="middle" font-size="15">Собирает заказ</text>
<text x="500" y="639" text-anchor="middle" font-size="15">и отмечает готовность</text>
</g>
<g class="step"><rect x="693" y="682" width="298" height="76" rx="30" fill="#f5e5c6" stroke="#957b8c" stroke-width="1.4"/><text x="842" y="706" text-anchor="middle" font-size="11" fill="#522944" font-weight="700">7 · Покупатель</text>
<text x="842" y="731" text-anchor="middle" font-size="15">Отменяет заказ до отправки</text>
</g>
<g class="step"><rect x="693" y="784" width="298" height="76" rx="30" fill="#f5e5c6" stroke="#957b8c" stroke-width="1.4"/><text x="842" y="808" text-anchor="middle" font-size="11" fill="#522944" font-weight="700">8 · Сервер</text>
<text x="842" y="827" text-anchor="middle" font-size="15">Отменяет заказ и возвращает</text>
<text x="842" y="845" text-anchor="middle" font-size="15">остатки в одной транзакции</text>
</g>
<g class="step"><rect x="351" y="784" width="298" height="76" rx="30" fill="#f1e3ed" stroke="#957b8c" stroke-width="1.4"/><text x="500" y="808" text-anchor="middle" font-size="11" fill="#522944" font-weight="700">9 · Сотрудник магазина</text>
<text x="500" y="833" text-anchor="middle" font-size="15">Передаёт заказ в доставку</text>
</g>
<g class="step"><rect x="351" y="879" width="298" height="76" rx="30" fill="#f1e3ed" stroke="#957b8c" stroke-width="1.4"/><text x="500" y="903" text-anchor="middle" font-size="11" fill="#522944" font-weight="700">10 · Покупатель</text>
<text x="500" y="928" text-anchor="middle" font-size="15">Оплачивает заказ при получении</text>
</g>
<g class="step"><rect x="351" y="974" width="298" height="76" rx="30" fill="#f1e3ed" stroke="#957b8c" stroke-width="1.4"/><text x="500" y="998" text-anchor="middle" font-size="11" fill="#522944" font-weight="700">11 · Сотрудник магазина</text>
<text x="500" y="1023" text-anchor="middle" font-size="15">Отмечает заказ доставленным</text>
</g>
</g></svg>